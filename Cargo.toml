[package]
name = "com-man"
version = "0.1.0"
edition = "2024"

[dependencies]
# Discord
dotenv = "0.15.0"
serenity = { version = "0.12.5", features = [ "collector" ] }
# Async
tokio = { version = "1.54.1", features = [ "rt-multi-thread", "signal" ] }
# Logging
tracing-subscriber = { version = "0.3.23", features = [ "env-filter" ] }
tracing = "0.1.44"
# Profiling
sysinfo = "0.39.6"
dhat = "0.3.3"
# Misc
chrono = "0.4"
thiserror = "2.0.21"
